# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lib:
    # https://github.com/actions/runner-images
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # https://github.com/nodejs/release#release-schedule
        node:
          - 22
          - 24
          - 26

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7

      # https://github.com/streetsidesoftware/cspell-action
      - uses: streetsidesoftware/cspell-action@v8
        with:
          incremental_files_only: false

      # https://github.com/actions/setup-node
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm test

  v30-petsotre-esm:
    # https://github.com/actions/runner-images
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # https://github.com/nodejs/release#release-schedule
        node:
          - 22
          - 24
          - 26

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7

      # https://github.com/actions/setup-node
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: 'examples/v3.0/petstore-esm/package-lock.json'

      - run: npm ci

      - run: npm ci
        working-directory: examples/v3.0/petstore-esm

      - run: npm run generate
        working-directory: examples/v3.0/petstore-esm

      - run: npm test
        working-directory: examples/v3.0/petstore-esm

  v30-petsotre-ts:
    # https://github.com/actions/runner-images
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # https://github.com/nodejs/release#release-schedule
        node:
          - 22
          - 24
          - 26

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7

      # https://github.com/actions/setup-node
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: 'examples/v3.0/petstore-ts/package-lock.json'

      - run: npm ci

      - run: npm ci
        working-directory: examples/v3.0/petstore-ts

      - run: npm run generate
        working-directory: examples/v3.0/petstore-ts

      - run: npm run build:ts
        working-directory: examples/v3.0/petstore-ts

      - run: npm test
        working-directory: examples/v3.0/petstore-ts
